project:
  type: website
  output-dir: ../work

website:
  title: "hellomister"
  navbar:
    left:
      - text: "home"
        href: ../index.html
      - text: "about"
        href: ../about.html
      - text: "work"
        href: index.qmd
      - text: "things"
        href: ../not_ready_yet2.html

format:
  html:
    theme: default
    css: assets/styles.scss
    include-in-header: |
      <link rel="stylesheet" href="https://use.typekit.net/rtn8uaf.css"> <!-- Adobe Fonts link -->
    include-after-body: |
      <script>
        // optional: add shadow when scrolling
        window.addEventListener('scroll', function () {
          var nav = document.querySelector('.navbar');
          if (!nav) return;
          if (window.scrollY > 2) { nav.classList.add('is-scrolled'); }
          else { nav.classList.remove('is-scrolled'); }
        });
      </script>
    title-block-style: none
    title-block-banner: false
