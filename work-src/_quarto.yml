project:
  type: website
  output-dir: ../work
  resources:
    - assets/**        # ensure assets copied
    - header.html      # ensure header file available

website:
  title: ""            # no built-in title
  navbar: false        # disable Quarto navbar entirely

format:
  html:
    theme: default
    # Inline your CSS so there’s no path issue
    include-in-header:
      - assets/header.css
      - |
        <link rel="stylesheet" href="https://use.typekit.net/rtn8uaf.css">
    # Inject your custom header HTML
    include-before-body: header.html
    title-block-style: none
    title-block-banner: false