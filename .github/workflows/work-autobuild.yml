name: Build & Deploy Work (Quarto)

on:
  push:
    branches: [ master ]   # trigger on either default name
    # Remove 'paths:' to ensure it runs on ANY push while we debug
    # paths:
    #   - 'work-src/**'
    #   - '.github/workflows/work-autobuild.yml'
  workflow_dispatch: {}           # allow manual run

permissions:
  contents: write  # allow committing back to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      #  uncomment the setup for R or python code blocks:
      # - name: Setup R
      #   uses: r-lib/actions/setup-r@v2
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'

      - name: Render Work site
        working-directory: work-src
        run: |
          quarto render

      - name: Commit rendered files (work/)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-render Work section"
            git push
          fi